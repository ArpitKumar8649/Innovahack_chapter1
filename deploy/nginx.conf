# VeritasAI production edge — nginx in front of the API.
# Static frontend served directly; /api/* proxied to the backend with
# SSE-safe streaming settings.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream veritasai_api {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # API — proxied with SSE-safe settings (no buffering, long timeout)
        location /api/ {
            proxy_pass http://veritasai_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        # static frontend with immutable asset caching
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public";
        }

        location ~* \.(js|css|svg|png|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
