services:
  - type: web
    name: veritasai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false   # set in Render dashboard
      - key: TAVILY_API_KEY
        sync: false   # set in Render dashboard
      - key: SERPER_API_KEY
        sync: false   # set in Render dashboard
