services:
  - type: web
    name: veritasai-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.backend
    healthCheckPath: /api/health
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false   # set in Render dashboard
      - key: TAVILY_API_KEY
        sync: false   # set in Render dashboard
      - key: SERPER_API_KEY
        sync: false   # set in Render dashboard
      - key: LLM_MODEL
        value: qwen3.5-plus
      - key: LLM_FALLBACK_MODEL
        value: qwen3.6-plus-2026-04-02
